<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LI-COR station - live data</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f8;color:#222;text-align:center;padding:1rem;box-sizing:border-box}
  a{color:#0b5cad;font-size:1.1rem}
</style>
</head>
<body>
<main>
  <p>Opening the live dashboard&hellip;</p>
  <!-- =====================================================================
       TO CHANGE WHERE THIS QR CODE GOES: edit the href on the next line.
       This is the only place the destination is set.
       ===================================================================== -->
  <p><a id="dest" href="https://www.licor.cloud/dashboards/0df4387c-455c-4de2-a9cc-113354560e36/true">Tap here if it doesn't open</a></p>
</main>
<script>
(function () {
  var GOATCOUNTER = "willkochtitzky";   // GoatCounter site code: willkochtitzky.goatcounter.com
  var dest = document.getElementById("dest").href;
  var done = false;
  function go() { if (!done) { done = true; window.location.replace(dest); } }
  try {
    var path = location.pathname.replace(/\.html$/, "").replace(/\/$/, "") || "/";
    var url = "https://" + GOATCOUNTER + ".goatcounter.com/count" +
      "?p=" + encodeURIComponent(path) +
      "&t=" + encodeURIComponent(document.title) +
      "&r=" + encodeURIComponent(document.referrer) +
      "&rnd=" + Math.random().toString(36).slice(2);
    fetch(url, { mode: "no-cors", keepalive: true, credentials: "omit" }).then(go, go);
  } catch (e) { go(); }
  setTimeout(go, 800);   // never hold a visitor more than 0.8 s, even if counting fails
})();
</script>
</body>
</html>
